<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>quexing 的博客</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="记录与分享 · 技术 · 生活" />

    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://b.quexing.cc.cd/" />
    <meta property="og:site_name" content="quexing 的博客" />
    <meta property="og:locale" content="zh_CN" />
    <!-- Twitter Card：X/Twitter 等平台的大图预览卡片 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="quexing 的博客" />
    <meta name="twitter:description" content="记录与分享 · 技术 · 生活" />
    <meta name="twitter:image" content="https://b.quexing.cc.cd/_media/og-card.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

    <!-- Docsify v5 Core Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <!-- Docsify v5 Vue Theme (add-on，保持 v4 外观) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
    <!-- 自定义侧边栏样式（300px 宽度 + 文件夹/文件图标 + 折叠，替代 sidebar-collapse 插件） -->
    <link rel="stylesheet" href="css/sidebar.css" />
    <!-- 自定义主题变量和样式（品牌色 / 暗色模式 / 表格 / 行内代码等） -->
    <link rel="stylesheet" href="css/theme.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mogeko/maple-mono-cn@7.9.0/dist/font/result.min.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- ============================================================
         重型库懒加载（KaTeX ≈270KB / Mermaid ≈2.7MB）
         原则：打开页面时不下载这些大库；文章渲染过程中检测到确实
         需要时才动态加载。检测本身是纯字符串/DOM 判断，零成本。
         ============================================================ -->
    <script>
      /* ================= KaTeX 懒加载 ================= */

      // katex 加载 Promise 缓存：保证全站只下载并执行一次
      let katexPromise = null;

      // 动态加载 katex 的 CSS 与 JS；重复调用直接复用缓存的 Promise
      function loadKatex() {
        if (!katexPromise) {
          katexPromise = new Promise(function (resolve, reject) {
            // CSS 插入 <link> 即可，无需等待加载完成
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css";
            document.head.appendChild(link);

            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js";
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }
        return katexPromise;
      }

      // 将 markdown 原文中的公式渲染为 HTML：
      //   $$...$$ → 块级公式（displayMode: true）
      //   $...$   → 行内公式
      // 先按「围栏代码块 / 行内代码」切分，代码片段原样保留，
      // 避免把代码里的 $ 符号误判成公式。
      function renderMath(content) {
        return content
          .split(/(```[\s\S]*?```|`[^`\n]*`)/g)
          .map(function (segment, index) {
            if (index % 2 === 1) return segment; // 代码片段，跳过不处理
            return segment
              .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
                return katex.renderToString(tex, { displayMode: true, throwOnError: false });
              })
              .replace(/\$([^$\n]+?)\$/g, function (_, tex) {
                return katex.renderToString(tex, { displayMode: false, throwOnError: false });
              });
          })
          .join("");
      }

      // docsify 插件：markdown 解析前（beforeEach）探测并渲染公式。
      // 原先的 docsify-katex 插件在解析阶段同步依赖 window.katex，
      // 与懒加载冲突，因此移除，渲染逻辑在这里自实现。
      function lazyKatexPlugin(hook) {
        hook.beforeEach(function (content, next) {
          // 快速探测：没有公式定界符则原样放行，完全不加载 katex
          const hasMath = /\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/.test(content);
          if (!hasMath) return next(content);

          loadKatex()
            .then(function () { next(renderMath(content)); })
            .catch(function () { next(content); }); // 加载失败也保证正文可见
        });
      }

      /* ================= Mermaid 懒加载 ================= */

      // mermaid 模块（ESM）加载缓存
      let mermaidPromise = null;

      // 首次调用时才动态 import mermaid（≈2.7MB）
      function loadMermaid() {
        if (!mermaidPromise) {
          mermaidPromise = import(
            "https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.esm.min.mjs"
          ).then(function (module) { return module.default; });
        }
        return mermaidPromise;
      }

      // docsify 插件：文章渲染完成后（doneEach）处理 mermaid 图。
      // 注意：本插件必须排在 Shiki 高亮插件之前执行（见 plugins 数组），
      // 这样 ```mermaid 代码块会先被转换为 div，不会被当成普通代码高亮。
      // 暗色模式说明：图在首次渲染时确定主题，切换暗色不会重绘（与原实现一致）。
      function lazyMermaidPlugin(hook) {
        hook.doneEach(async function () {
          // 1) 把 ```mermaid 代码块转换为 mermaid 可识别的 <div class="mermaid">
          //    （同步执行，保证先于 Shiki 插件完成转换）
          document.querySelectorAll("pre code.lang-mermaid").forEach(function (code) {
            const div = document.createElement("div");
            div.className = "mermaid";
            div.textContent = code.textContent;
            code.parentElement.replaceWith(div);
          });

          // 2) 没有图就直接返回，完全不加载 mermaid。
          //    data-processed 是 mermaid 渲染成功后自动打的标记，用于跳过已渲染的图
          const nodes = document.querySelectorAll(".mermaid:not([data-processed])");
          if (nodes.length === 0) return;

          // 3) 有图才加载并手动渲染（startOnLoad 必须关闭，时机由我们控制）
          const mermaid = await loadMermaid();
          mermaid.initialize({ startOnLoad: false });
          await mermaid.run({ nodes: nodes });
        });
      }
    </script>

    <script>
      // 剥离文章开头的 front-matter（--- date: ... ---，供 update-sidebar.js 读取），
      // 防止它被渲染成正文里的分隔线和 "date: ..." 文字。
      // \uFEFF? 容忍 UTF-8 BOM 头（Windows 记事本保存的文件常见），与脚本侧的剥离逻辑保持一致
      function stripFrontMatterPlugin(hook) {
        hook.beforeEach(function (content) {
          return content.replace(/^\uFEFF?---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
        });
      }

      // 文章底部的"最后更新时间"：读 front-matter 的 updated（缺失退回 date），
      // 解析口径与 scripts/update-sidebar.js 的 readFrontMatter 一致。
      // 原先用 docsify-updated 插件，其时间取自服务器返回的 Last-Modified 响应头，
      // 而 Vercel 返回的是请求/缓存时刻（实测与 Date 响应头相同），与文章真实
      // 修改时间无关，故弃用，改用跟着内容走的 front-matter 日期。
      // 注意：必须在 stripFrontMatterPlugin 之前执行（plugins 数组里排在前面），
      // 否则 front-matter 已被剥掉、读不到日期。
      function frontMatterTimePlugin(hook) {
        hook.beforeEach(function (content) {
          const match = content.match(/^\uFEFF?---\r?\n([\s\S]*?)\r?\n---/);
          if (!match) return content;
          const read = function (key) {
            const line = match[1].match(new RegExp("^" + key + ":\\s*(\\d{4}-\\d{2}-\\d{2})\\s*$", "m"));
            return line ? line[1] : null;
          };
          const date = read("updated") || read("date");
          if (!date) return content;
          return content + "\n\n<div class='update-time'>最后更新时间: " + date + "</div>";
        });
      }

      // 动态标题：渲染完成后把当前文章名写进 document.title，
      // 让浏览器标签 / 历史记录 / 分享链接能区分文章（对会执行 JS 的爬虫也有效）。
      // 命名口径与侧边栏生成脚本一致：文件名去 .md、下划线转空格
      function updateTitlePlugin(hook, vm) {
        hook.doneEach(function () {
          const base = "quexing 的博客";
          const file = vm.route.file; // 如 "note/win_e.md"、"home.md"
          const name =
            file && file !== "home.md"
              ? decodeURIComponent(file.split("/").pop().replace(/\.md$/, "")).replace(/_/g, " ")
              : "";
          document.title = name ? name + " · " + base : base;
        });
      }

      // Shiki 高亮后添加复制按钮的函数
      function addCopyButtonsToShiki() {
        document.querySelectorAll("pre.shiki").forEach((pre) => {
          if (pre.querySelector(".copy-btn")) return;

          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "复制";

          btn.addEventListener("click", async () => {
            const code = pre.querySelector("code")?.textContent || "";
            try {
              await navigator.clipboard.writeText(code);
              btn.textContent = "已复制";
              setTimeout(() => (btn.textContent = "复制"), 1000);
            } catch {
              btn.textContent = "失败";
              setTimeout(() => (btn.textContent = "复制"), 1000);
            }
          });

          pre.appendChild(btn);
        });
      }

      window.$docsify = {
        name: "𝓺𝓾𝓮𝔁𝓲𝓷𝓰",
        loadSidebar: true,
        // 相对链接按当前页面所在目录解析（默认 false 时从站点根解析，
        // 笔记内部的 ../xx/yy.md 相对链接全部 404）。
        // 开启后 _sidebar.md / home.md 里的链接必须用 /note/ 绝对路径
        relativePath: true,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
        },
        homepage: "home.md",

        // 分页导航
        pagination: {
          previousText: "上一篇",
          nextText: "下一篇",
          crossChapter: true,
          crossChapterText: true,
        },

        // 字数统计
        count: {
          countable: true,
          fontsize: "0.9em",
          language: "chinese",
        },

        // 侧边栏折叠配置 - 默认展开层级（由 js/sidebar.js 读取）
        sidebarDisplayLevel: 2,

        // 全文搜索配置
        search: {
          maxAge: 86400000, // 过期时间，单位毫秒，默认一天
          paths: "auto", // 自动索引所有页面
          placeholder: "搜索文档...",
          noData: "找不到相关结果",
          depth: 3, // 搜索标题的最大层级
          hideOtherSidebarContent: false, // 是否隐藏其他侧边栏内容
        },

        // 插件列表（顺序敏感：frontMatterTime 必须在 front-matter 剥离之前执行，
        // 否则读不到日期；mermaid 必须在 shiki 之前执行，
        // 以便 mermaid 代码块先被转换成 div，不被 shiki 当普通代码高亮）
        plugins: [
          // 最后更新时间：读 front-matter 的 updated/date 显示在文章底部（函数定义见上方脚本）
          frontMatterTimePlugin,
          // front-matter 剥离：去掉文章头部 --- date: ... --- 块（函数定义见上方脚本）
          stripFrontMatterPlugin,
          // 动态标题：当前文章名写入 document.title（函数定义见上方脚本）
          updateTitlePlugin,
          // KaTeX 懒加载：文章含 $...$ 公式时才加载 katex（函数定义见上方脚本）
          lazyKatexPlugin,
          // Mermaid 懒加载：文章含 ```mermaid 代码块时才加载 mermaid（函数定义见上方脚本）
          lazyMermaidPlugin,
          // Shiki 代码高亮：shiki 内核在 window.shikiHighlight 内按需加载
          function (hook, vm) {
            hook.doneEach(async function () {
              if (!window.shikiHighlight) return;

              for (const block of document.querySelectorAll("pre code")) {
                const pre = block.parentElement;
                if (pre.classList.contains("shiki")) continue;

                const lang =
                  Array.from(block.classList)
                    .find((c) => c.startsWith("lang-"))
                    ?.replace("lang-", "") || "text";

                pre.outerHTML = await window.shikiHighlight(block.textContent, lang);
              }

              // Shiki 高亮后重新添加复制按钮
              addCopyButtonsToShiki();
            });
          },
        ],
      };
    </script>
    <!-- Docsify v5 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

    <!-- plugins -->

    <!-- KaTeX 全局 JS 已移除，改为懒加载（见 body 顶部脚本） -->
    <!-- 分页导航插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
    <!-- 图片缩放插件（v5 内置） -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <!-- 字数统计插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.min.js"></script>
    <!-- 搜索插件（v5 内置） -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <!-- 脚注插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-footnote@1.0.8/dist/docsify-footnote.min.js"></script>
    <!-- Shiki 代码高亮（懒加载：页面有代码块时才下载 shiki 内核） -->
    <script>
      // shiki 模块加载缓存：首次真正高亮时才 import，全站只加载一次。
      // darkmode.js 切换主题重新高亮时也通过 window.loadShiki 获取模块，
      // 因此 shiki 的版本 URL 只在本处维护。
      let shikiModulePromise = null;
      window.loadShiki = function () {
        if (!shikiModulePromise) {
          shikiModulePromise = import("https://cdn.jsdelivr.net/npm/shiki@1.29.2/+esm");
        }
        return shikiModulePromise;
      };

      // docsify 代码块语言别名 → shiki 语言名
      const langMap = {
        js: "javascript",
        ts: "typescript",
        py: "python",
        sh: "bash",
        shell: "bash",
        yml: "yaml",
        md: "markdown",
      };

      // 高亮入口：由 $docsify 的 Shiki 插件（doneEach）在存在代码块时调用。
      // 首次调用才会触发 shiki 下载；语言不支持时降级为纯文本高亮。
      window.shikiHighlight = async (code, lang) => {
        const { codeToHtml } = await window.loadShiki();
        lang = lang.toLowerCase();
        lang = langMap[lang] || lang || "text";
        const currentTheme = document.documentElement.getAttribute("data-theme") === "dark"
          ? "catppuccin-mocha"
          : "catppuccin-latte";
        let html;
        try {
          html = await codeToHtml(code, { lang, theme: currentTheme });
        } catch (e) {
          console.warn(`Shiki: Language "${lang}" not found, fallback to text`);
          lang = "text";
          html = await codeToHtml(code, { lang: "text", theme: currentTheme });
        }
        // Shiki 默认输出的 <code> 不带 language-xxx class、<pre> 不带 data-lang，
        // v5 核心主题的代码块样式依赖这些标记，缺失时样式不生效。补上。
        html = html.replace(/<pre([^>]*)>/, function (m, attrs) {
          if (/data-lang=/.test(attrs)) return m;
          return '<pre' + attrs + ' data-lang="' + lang + '">';
        });
        html = html.replace(/<code([^>]*)>/, function (m, attrs) {
          if (/class=/.test(attrs)) {
            return m.replace(/class="([^"]*)"/, function (cm, cls) {
              return 'class="' + cls + ' language-' + lang + '"';
            });
          }
          return '<code' + attrs + ' class="language-' + lang + '">';
        });
        return html;
      };
    </script>

    <!-- 红心点击特效 -->
    <script src="https://cdn.jsdelivr.net/gh/mukeshkushwahae/click-heart-animation@v1.0.0/dist/click-heart-animation.min.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        ClickHeartAnimation.init();
      });
    </script>

    <!-- 暗色模式切换 -->
    <script src="js/darkmode.js"></script>
    <!-- 顶部阅读进度条 -->
    <script src="js/reading-progress.js"></script>
    <!-- 自定义侧边栏折叠交互（替代 docsify-sidebar-collapse 社区插件，v5 结构） -->
    <script src="js/sidebar.js"></script>
  </body>
